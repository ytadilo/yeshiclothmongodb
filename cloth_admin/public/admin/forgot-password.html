<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Yeshi Admin</title>
    <link rel="icon" type="image/png" href="/images/logo.png">
    <meta name="theme-color" content="#1E4B35">
    <script src="/js/admin-config.js?v=20260716"></script>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/auth.css">
    <script src="/admin/_auth-redirect.js"></script>
</head>
<body class="auth-page">
    <main class="auth-shell" role="main">
        <section class="auth-brand" aria-label="Admin recovery">
            <div class="auth-logo"><img src="/images/logo.png" alt="Yeshi"></div>
            <div class="auth-badge">Admin recovery -+ Email OTP</div>
            <h1 class="auth-title">Forgot password?</h1>
            <p class="auth-subtitle">WeGÇÖll email you a one-time code (OTP) to reset your admin password.</p>

            <div class="auth-feature-list" aria-hidden="true">
                <div class="auth-feature"><span>G£ô</span><div><strong>OTP</strong> expires for safety.</div></div>
                <div class="auth-feature"><span>G£ô</span><div><strong>Quick</strong> reset process.</div></div>
                <div class="auth-feature"><span>G£ô</span><div><strong>Secure</strong> admin-only flow.</div></div>
            </div>
        </section>

        <section class="auth-panel" aria-label="Forgot password form">
            <h2>Forgot Password</h2>
            <p>Enter your admin email to receive an OTP.</p>

            <p class="auth-hint" id="msgBox" style="display:none; color: var(--accent-color);"></p>

            <form id="forgotForm" class="auth-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="Admin email" autocomplete="email" inputmode="email" required>
                </div>
                <div class="auth-actions">
                    <button type="submit" class="btn">Send OTP</button>
                </div>
            </form>

            <div class="auth-links">
                    <div><a href="/auth/login">Back to Login</a></div>
            </div>
        </section>
    </main>

    <script>
        async function readJsonSafe(res) {
            const text = await res.text();
            if (!text) return null;
            try {
                return JSON.parse(text);
            } catch (_) {
                return { msg: text };
            }
        }

        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = e.target.email.value;
            
            try {
                const res = await fetch('/api/auth/admin/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await readJsonSafe(res);
                
                if (res.ok) {
                    // Save email for next steps
                    localStorage.setItem('resetEmail', email);
                    document.getElementById('msgBox').innerText = (data && data.msg) || 'OTP sent.';
                    document.getElementById('msgBox').style.display = 'block';
                    setTimeout(() => {
                        window.location.href = '/admin/verify-otp';
                    }, 1500);
                } else {
                    alert((data && data.msg) || `Request failed (HTTP ${res.status})`);
                }
            } catch (err) {
                console.error(err);
                alert('Error sending OTP');
            }
        });
    </script>
</body>
</html>
