<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Yeshi Admin</title>
    <link rel="icon" type="image/png" href="/images/logo.png">
    <meta name="theme-color" content="#1E4B35">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/auth.css">
    <script src="/js/admin-config.js?v=20260716"></script>
    <script src="/admin/_auth-redirect.js"></script>
</head>
<body class="auth-page">
    <main class="auth-shell" role="main">
        <section class="auth-brand" aria-label="Reset password">
            <div class="auth-logo"><img src="/images/logo.png" alt="Yeshi"></div>
            <div class="auth-badge">Admin recovery -+ Set new password</div>
            <h1 class="auth-title">Create a new password</h1>
            <p class="auth-subtitle">Choose a strong password to protect your admin account.</p>

            <div class="auth-feature-list" aria-hidden="true">
                <div class="auth-feature"><span>G��</span><div><strong>Strong</strong> passwords recommended.</div></div>
                <div class="auth-feature"><span>G��</span><div><strong>Secure</strong> OTP-verified reset.</div></div>
                <div class="auth-feature"><span>G��</span><div><strong>Instant</strong> access after login.</div></div>
            </div>
        </section>

        <section class="auth-panel" aria-label="Reset form">
            <h2>Set New Password</h2>
            <p>Enter and confirm your new password.</p>

            <form id="resetForm" class="auth-form">
                <div class="form-group">
                    <label for="newPassword">New password</label>
                    <div class="password-row">
                        <input type="password" id="newPassword" name="newPassword" class="form-control" placeholder="New password" required minlength="6" autocomplete="new-password">
                        <button type="button" class="password-toggle" data-toggle-password="newPassword" aria-label="Show password">Show</button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm password</label>
                    <div class="password-row">
                        <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="Confirm password" required minlength="6" autocomplete="new-password">
                        <button type="button" class="password-toggle" data-toggle-password="confirmPassword" aria-label="Show password">Show</button>
                    </div>
                </div>
                <div class="auth-actions">
                    <button type="submit" class="btn">Reset Password</button>
                </div>
            </form>

            <div class="auth-links">
                    <div><a href="/auth/login">Back to Login</a></div>
            </div>
        </section>
    </main>

    <script>
        (function () {
            function togglePassword(targetId, button) {
                var input = document.getElementById(targetId);
                if (!input) return;
                var isPassword = input.type === 'password';
                input.type = isPassword ? 'text' : 'password';
                button.textContent = isPassword ? 'Hide' : 'Show';
                button.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
            }

            document.addEventListener('click', function (e) {
                var btn = e.target && e.target.closest ? e.target.closest('[data-toggle-password]') : null;
                if (!btn) return;
                var id = btn.getAttribute('data-toggle-password');
                togglePassword(id, btn);
            });
        })();

        const email = localStorage.getItem('resetEmail');
        const otp = localStorage.getItem('resetOTP');

        if (!email || !otp) {
            alert('Invalid session. Start over.');
            window.location.href = '/admin/forgot-password';
        }

        async function readJsonSafe(res) {
            const text = await res.text();
            if (!text) return null;
            try {
                return JSON.parse(text);
            } catch (_) {
                return { msg: text };
            }
        }

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = e.target.newPassword.value;
            const confirmPassword = e.target.confirmPassword.value;

            if(newPassword !== confirmPassword) {
                alert('Passwords do not match');
                return;
            }
            
            try {
                const res = await fetch('/api/auth/admin/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, otp, newPassword })
                });

                const data = await readJsonSafe(res);
                
                if (res.ok) {
                    alert('Password successfully reset! Please login.');
                    localStorage.removeItem('resetEmail');
                    localStorage.removeItem('resetOTP');
                    window.location.href = '/';
                } else {
                    alert((data && data.msg) || `Request failed (HTTP ${res.status})`);
                }
            } catch (err) {
                console.error(err);
                alert('Error resetting password');
            }
        });
    </script>
</body>
</html>
