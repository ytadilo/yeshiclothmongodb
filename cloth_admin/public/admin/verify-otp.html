<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - Yeshi Admin</title>
    <link rel="icon" type="image/png" href="/images/logo.png">
    <meta name="theme-color" content="#1E4B35">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/auth.css">
    <script src="/js/admin-config.js"></script>
    <script src="/admin/_auth-redirect.js"></script>
</head>
<body class="auth-page">
    <main class="auth-shell" role="main">
        <section class="auth-brand" aria-label="OTP verification">
            <div class="auth-logo"><img src="/images/logo.png" alt="Yeshi"></div>
            <div class="auth-badge">Security check ┬╖ Verify OTP</div>
            <h1 class="auth-title">Enter the OTP</h1>
            <p class="auth-subtitle">Check your email for the 6-digit code and enter it to continue.</p>

            <div class="auth-feature-list" aria-hidden="true">
                <div class="auth-feature"><span>Γ£ô</span><div><strong>One-time</strong> code verification.</div></div>
                <div class="auth-feature"><span>Γ£ô</span><div><strong>Short</strong> expiry window.</div></div>
                <div class="auth-feature"><span>Γ£ô</span><div><strong>Safe</strong> password reset flow.</div></div>
            </div>
        </section>

        <section class="auth-panel" aria-label="OTP form">
            <h2>Verify OTP</h2>
            <p>Enter the 6-digit code we sent to your email.</p>

            <form id="otpForm" class="auth-form">
                <div class="form-group">
                    <label for="otp">OTP Code</label>
                    <input type="text" id="otp" name="otp" class="form-control otp" placeholder="ΓÇóΓÇóΓÇóΓÇóΓÇóΓÇó" required maxlength="6" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}">
                </div>
                <div class="auth-actions">
                    <button type="submit" class="btn">Verify</button>
                </div>
            </form>

            <div class="auth-links">
                <div><a class="secondary" href="/admin/forgot-password">Resend OTP</a></div>
            </div>
        </section>
    </main>

    <script>
        const email = localStorage.getItem('resetEmail');
        if (!email) {
            alert('No email found for process. Please start over.');
            window.location.href = '/admin/forgot-password';
        }

        async function readJsonSafe(res) {
            const text = await res.text();
            if (!text) return null;
            try {
                return JSON.parse(text);
            } catch (_) {
                return { msg: text };
            }
        }

        document.getElementById('otpForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const otp = e.target.otp.value;
            
            try {
                const res = await fetch('/api/auth/admin/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, otp })
                });

                const data = await readJsonSafe(res);
                
                if (res.ok) {
                    localStorage.setItem('resetOTP', otp); // Store verified OTP for the reset step
                    window.location.href = '/admin/reset-password';
                } else {
                    alert((data && data.msg) || `Request failed (HTTP ${res.status})`);
                }
            } catch (err) {
                console.error(err);
                alert('Error verifying OTP');
            }
        });
    </script>
</body>
</html>
