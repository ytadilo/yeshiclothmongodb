<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Yeshi</title>
    <link rel="icon" type="image/png" href="/images/logo.png">
    <script defer src="/js/adsense.js"></script>
    <meta name="theme-color" content="#1E4B35">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-page">

    <main class="auth-shell auth-shell-single" role="main">
        <section class="auth-panel" aria-label="Login form">
            <div class="auth-panel-logo"><img src="/images/logo.png" alt="Yeshi"></div>
            <h2>Login</h2>
            <p>Use your email and password to continue.</p>

            <form id="loginForm" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" class="form-control" autocomplete="email" inputmode="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-row">
                        <input type="password" id="password" class="form-control" autocomplete="current-password" required>
                        <button type="button" class="password-toggle" data-toggle-password="password" aria-label="Show password">Show</button>
                    </div>
                </div>

                <div class="auth-actions">
                    <button type="submit" class="btn">Login</button>
                </div>
            </form>

            <div style="margin-top: 10px;">
                <a class="secondary" href="/auth/forgot-password">Forgot password?</a>
            </div>

            <div class="auth-divider"><span>or</span></div>
            <div id="googleSignIn" class="google-signin"></div>

            <div class="auth-links">
                <div>Don’t have an account? <a class="secondary" href="/auth/register">Create one</a></div>
                <div><a href="/index.html">Continue browsing</a></div>
            </div>
            <div class="auth-hint">Tip: your session stays signed in on this device.</div>
        </section>
    </main>

    <script src="/js/main.js"></script>
    <script src="/js/auth.js?v=20260414"></script>
    <script>
        (function () {
            function togglePassword(targetId, button) {
                var input = document.getElementById(targetId);
                if (!input) return;
                var isPassword = input.type === 'password';
                input.type = isPassword ? 'text' : 'password';
                button.textContent = isPassword ? 'Hide' : 'Show';
                button.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
            }

            document.addEventListener('click', function (e) {
                var btn = e.target && e.target.closest ? e.target.closest('[data-toggle-password]') : null;
                if (!btn) return;
                var id = btn.getAttribute('data-toggle-password');
                togglePassword(id, btn);
            });
        })();
    </script>
</body>
</html>
