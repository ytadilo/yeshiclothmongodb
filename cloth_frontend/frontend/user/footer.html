<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footer - Yeshi</title>
    <link rel="icon" type="image/png" href="/images/logo.png">
    <script defer src="/js/adsense.js"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            primary: '#745b18',
                            accent: '#d4b468',
                            ink: '#1a1c1c',
                            paper: '#faf9f9',
                            muted: '#4d4639'
                        }
                    },
                    boxShadow: {
                        nav: '0 20px 40px rgba(26, 28, 28, 0.08)'
                    },
                    fontFamily: {
                        body: ['Inter', 'sans-serif']
                    }
                }
            }
        };
    </script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { margin: 0; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { scrollbar-width: none; }
    </style>
</head>

<body class="footer-hub-page bg-brand-paper font-body text-brand-ink antialiased yeshi-has-bottom-nav">
<main class="mx-auto max-w-[1920px] px-4 pb-16 pt-8 md:px-10"></main>

    <script src="/js/main.js"></script>
</body>
</html>
