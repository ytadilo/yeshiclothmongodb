<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Yeshi</title>
    <link rel="icon" type="image/png" href="/images/logo.png">
    <script defer src="/js/adsense.js"></script>
    <meta name="theme-color" content="#1E4B35">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-page">
    <main class="auth-shell" role="main">
        <section class="auth-brand" aria-label="Brand">
            <div class="auth-logo"><img src="/images/logo.png" alt="Yeshi"></div>
            <div class="auth-badge">Secure reset</div>
            <h1 class="auth-title">Choose a new password</h1>
            <p class="auth-subtitle">Enter your new password twice to confirm.</p>
        </section>

        <section class="auth-panel" aria-label="Reset password form">
            <h2>Set New Password</h2>
            <p>This will sign you in again.</p>

            <form id="resetForm" class="auth-form">
                <div class="form-group">
                    <label for="password">New password</label>
                    <input type="password" id="password" class="form-control" autocomplete="new-password" minlength="6" required>
                </div>

                <div class="form-group">
                    <label for="confirm">Confirm new password</label>
                    <input type="password" id="confirm" class="form-control" autocomplete="new-password" minlength="6" required>
                </div>

                <div class="auth-actions">
                    <button type="submit" class="btn">Reset password</button>
                </div>

                <div id="status" style="margin-top: 10px; color: var(--light-text);"></div>
            </form>

            <div class="auth-links">
                <div><a class="secondary" href="/auth/login">Back to login</a></div>
                <div><a href="/index.html">Continue browsing</a></div>
            </div>
        </section>
    </main>

    <script>
        function getQuery(name) {
            try {
                return new URLSearchParams(window.location.search).get(name);
            } catch (_) {
                return null;
            }
        }

        async function readJsonSafe(res) {
            const text = await res.text();
            if (!text) return null;
            try {
                return JSON.parse(text);
            } catch (_) {
                return { msg: text };
            }
        }

        function persistSession(data) {
            if (!data || !data.token || !data.user) return;

            localStorage.setItem('token', data.token);
            localStorage.setItem('user', JSON.stringify(data.user));
            if (data.user.role) localStorage.setItem('role', data.user.role);
            if (!localStorage.getItem('loginTime')) {
                localStorage.setItem('loginTime', Date.now().toString());
            }

            try {
                window.dispatchEvent(new CustomEvent('yeshi:auth-state-changed'));
            } catch (_) {
                // Ignore CustomEvent failures.
            }
        }

        function getPostResetDestination(user) {
            const role = String(user && user.role || localStorage.getItem('role') || '').trim().toLowerCase();
            if (role === 'admin') return '/admin';
            return '/user/';
        }

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = getQuery('token');
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm').value;
            const status = document.getElementById('status');

            if (!token) {
                status.textContent = 'Missing reset token. Please request a new link.';
                return;
            }
            if (password !== confirm) {
                status.textContent = 'Passwords do not match.';
                return;
            }

            status.textContent = 'Resetting...';

            try {
                const res = await fetch('/api/auth/reset-password-link', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password, confirmPassword: confirm })
                });
                const data = await readJsonSafe(res);
                if (!res.ok) throw new Error((data && data.msg) || `Failed to reset password (HTTP ${res.status})`);

                // Auto-login after reset
                persistSession(data);

                status.textContent = 'Password updated. Redirecting...';
                setTimeout(() => {
                    window.location.href = getPostResetDestination(data && data.user);
                }, 600);
            } catch (err) {
                console.error(err);
                status.textContent = err?.message || 'Failed to reset password.';
            }
        });
    </script>
</body>
</html>
