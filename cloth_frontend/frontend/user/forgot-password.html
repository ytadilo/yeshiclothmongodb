<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Yeshi</title>
    <link rel="icon" type="image/png" href="/images/logo.png">
    <meta name="theme-color" content="#1E4B35">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-page">
    <main class="auth-shell" role="main">
        <section class="auth-brand" aria-label="Brand">
            <div class="auth-logo"><img src="/images/logo.png" alt="Yeshi"></div>
            <div class="auth-badge">Account recovery</div>
            <h1 class="auth-title">Reset your password</h1>
            <p class="auth-subtitle">Enter your email and we’ll send a password reset link.</p>
        </section>

        <section class="auth-panel" aria-label="Forgot password form">
            <h2>Forgot Password</h2>
            <p>We’ll email you a secure link.</p>

            <form id="forgotForm" class="auth-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" class="form-control" autocomplete="email" required>
                </div>

                <div class="auth-actions">
                    <button type="submit" class="btn">Send reset link</button>
                </div>

                <div id="status" style="margin-top: 10px; color: var(--light-text);"></div>
            </form>

            <div class="auth-links">
                <div><a class="secondary" href="/auth/login">Back to login</a></div>
                <div><a href="/index.html">Continue browsing</a></div>
            </div>
        </section>
    </main>

    <script>
        async function readJsonSafe(res) {
            const text = await res.text();
            if (!text) return null;
            try {
                return JSON.parse(text);
            } catch (_) {
                return { msg: text };
            }
        }

        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const status = document.getElementById('status');
            status.textContent = 'Sending...';

            try {
                const res = await fetch('/api/auth/forgot-password-link', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await readJsonSafe(res);
                if (!res.ok) throw new Error((data && data.msg) || `Failed to send reset link (HTTP ${res.status})`);
                status.textContent = (data && data.msg) || 'Reset link sent.';
            } catch (err) {
                console.error(err);
                status.textContent = err?.message || 'Failed to send reset link.';
            }
        });
    </script>
</body>
</html>
